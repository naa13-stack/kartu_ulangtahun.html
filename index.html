<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Text Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const phrases = [
            "I love you", "Aku cinta kamu", "Te amo", "Je t'aime", 
            "Ich liebe dich", "Seni seviyorum", "Ti amo", "Я тебя люблю", 
            "사랑해", "愛してる", "Jag älskar dig", "Kocham cię", 
            "Anh yêu em", "Ik hou van je", "Eu te amo", "Mahal kita"
        ];

        // Rumus Matematika Bentuk Hati (Parametric Heart Equation)
        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return {
                x: canvas.width / 2 + x * scale,
                y: canvas.height / 2 + y * scale
            };
        }

        let currentStep = 0;
        const totalSteps = 100;
        let phraseIndex = 0;

        function drawNext() {
            if (currentStep < totalSteps) {
                const t = (currentStep / totalSteps) * Math.PI * 2;

                // Mengisi bagian dalam dan garis luar bentuk hati
                for (let r = 0.4; r <= 1.5; r += 0.30) {
                    const scale = 16 * r;
                    const pos = getHeartPoint(t, scale);
                    const phrase = phrases[phraseIndex % phrases.length];
                    phraseIndex++;

                    // Variasi warna merah terang hingga merah keemasan
                    const alpha = 0.7 + Math.random() * 0.3;
                    ctx.fillStyle = `rgba(255, ${Math.floor(40 + Math.random() * 50)}, ${Math.floor(60 + Math.random() * 40)}, ${alpha})`;
                    
                    const fontSize = Math.floor(10 + Math.random() * 6);
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    const offsetX = (Math.random() - 0.5) * 8;
                    const offsetY = (Math.random() - 0.5) * 8;

                    ctx.fillText(phrase, pos.x + offsetX, pos.y + offsetY);
                }

                currentStep++;
                setTimeout(drawNext, 38); // Kecepatan kemunculan teks
            }
        }

        drawNext();
    </script>
</body>
</html>
