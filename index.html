<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Love Heart Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #05020a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        canvas {
            display: block;
            filter: drop-shadow(0 0 10px rgba(255, 42, 109, 0.3));
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const phrases = [
            "I love you", "Aku cinta kamu", "Te amo", "Je t'aime", 
            "Ich liebe dich", "Seni seviyorum", "Ti amo", "Я тебя люблю", 
            "사랑해", "愛してる", "Jag älskar dig", "Kocham cię", 
            "Anh yêu em", "Ik hou van je", "Eu te amo", "Mahal kita"
        ];

 
        function heartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * scale, y: y * scale };
        }

        // Menyusun koordinat teks secara terstruktur dan rapi
        const items = [];
        const totalItems = 280;

        for (let i = 0; i < totalItems; i++) {
            const t = (i / totalItems) * Math.PI * 2;
            const layer = (i % 4) + 1; 
            const scale = 14 * (layer / 4);
            
            items.push({
                t,
                scale,
                phrase: phrases[i % phrases.length],
                hue: 330 + (i % 30),
                size: 9 + (layer * 1.5)
            });
        }

        let progress = 0;
        let time = 0;

        function render() {
            // Memberikan efek bayangan jejak yang sangat lembut
            ctx.fillStyle = 'rgba(5, 2, 10, 0.2)';
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;
            const visibleCount = Math.floor(progress);

            // Efek denyutan lembut (heartbeat pulse)
            const pulse = 1 + 0.02 * Math.sin(time * 2);

            for (let i = 0; i < visibleCount; i++) {
                const item = items[i];
                const pos = heartPoint(item.t, item.scale * pulse);
                
                const x = cx + pos.x;
                const y = cy + pos.y;

                ctx.fillStyle = `hsl(${item.hue}, 100%, 65%)`;
                ctx.font = `bold ${item.size}px 'Segoe UI', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.phrase, x, y);
            }

            if (progress < items.length) {
                progress += 1.2; // Kecepatan susunan teks kemunculan awal
            }

            time += 0.03;
            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
