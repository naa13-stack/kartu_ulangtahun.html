<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Love Heart Animation (0.5 Detik/Detak)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #05020a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        canvas {
            display: block;
            filter: drop-shadow(0 0 12px rgba(255, 42, 109, 0.4));
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        // Cache emoji ke offscreen canvas untuk performa optimal
        const stickerEmojis = ['💖', '❤️', '💕', '💗', '💓', '✨'];
        const emojiSprites = stickerEmojis.map(emoji => {
            const c = document.createElement('canvas');
            c.width = 50;
            c.height = 50;
            const cx = c.getContext('2d');
            cx.font = '32px sans-serif';
            cx.textAlign = 'center';
            cx.textBaseline = 'middle';
            cx.fillText(emoji, 25, 25);
            return c;
        });

        const bgHearts = [];
        function initBgHearts() {
            bgHearts.length = 0;
            const count = Math.floor((width * height) / 15000);
            for (let i = 0; i < count; i++) {
                bgHearts.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    scale: 0.5 + Math.random() * 0.7,
                    speedY: 0.4 + Math.random() * 0.8,
                    speedX: (Math.random() - 0.5) * 0.5,
                    opacity: 0.2 + Math.random() * 0.5,
                    sprite: emojiSprites[Math.floor(Math.random() * emojiSprites.length)],
                    angle: Math.random() * Math.PI * 2,
                    spinSpeed: (Math.random() - 0.5) * 0.02
                });
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initBgHearts();
        }
        resize();
        window.addEventListener('resize', resize);

        const phrases = [
            "I love you", "Aku cinta kamu", "Te amo", "Je t'aime", 
            "Ich liebe dich", "Seni seviyorum", "Ti amo", "Я тебя люблю", 
            "사랑해", "愛してる", "Jag älskar dig", "Kocham cię", 
            "Anh yêu em", "Ik hou van je", "Eu te amo", "Mahal kita"
        ];

        function heartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * scale, y: y * scale };
        }

        const items = [];
        const totalItems = 280;

        for (let i = 0; i < totalItems; i++) {
            const t = (i / totalItems) * Math.PI * 2;
            const layer = (i % 4) + 1; 
            const scale = 14 * (layer / 4);
            
            items.push({
                t,
                scale,
                phrase: phrases[i % phrases.length],
                hue: 330 + (i % 30),
                size: 9 + (layer * 1.5)
            });
        }

        let startTime = null;
        const duration = 5000; // Durasi pembentukan tepat 5 detik

        function updateAndDrawBgHearts(timeSec) {
            for (let heart of bgHearts) {
                heart.y -= heart.speedY;
                heart.x += Math.sin(timeSec * 2 + heart.y * 0.01) * heart.speedX;
                heart.angle += heart.spinSpeed;

                if (heart.y < -50) {
                    heart.y = height + 50;
                    heart.x = Math.random() * width;
                }

                ctx.save();
                ctx.globalAlpha = heart.opacity * (0.8 + 0.2 * Math.sin(timeSec * 3 + heart.x));
                ctx.translate(heart.x, heart.y);
                ctx.rotate(heart.angle);
                ctx.scale(heart.scale, heart.scale);
                ctx.drawImage(heart.sprite, -25, -25);
                ctx.restore();
            }
        }

        function render(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const timeSec = timestamp / 1000;

            const progressRatio = Math.min(elapsed / duration, 1);
            const visibleCount = Math.floor(progressRatio * totalItems);

            ctx.fillStyle = 'rgba(5, 2, 10, 0.3)';
            ctx.fillRect(0, 0, width, height);

            updateAndDrawBgHearts(timeSec);

            const cx = width / 2;
            const cy = height / 2;

            // Tempo detak disesuaikan tepat 0.5 detik per detak
            const beat = Math.pow(Math.sin(timeSec * Math.PI / 0.5), 8) * 0.12;
            const pulse = 1 + beat;

            for (let i = 0; i < visibleCount; i++) {
                const item = items[i];
                const pos = heartPoint(item.t, item.scale * pulse);
                
                const x = cx + pos.x;
                const y = cy + pos.y;

                ctx.fillStyle = `hsl(${item.hue}, 100%, 65%)`;
                ctx.font = `bold ${item.size * pulse}px 'Segoe UI', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.phrase, x, y);
            }

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
